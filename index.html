<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="description" content="Cardápio e pedidos do O Caseirão Burger">
<title>O Caseirão Burger</title>
<link rel="stylesheet" href="./css/app.css?v=2.0.0">
<script defer src="./js/app.js?v=2.0.0"></script>
</head>
<body>
<header class="top">
  <div><h1 id="storeName">O Caseirão Burger</h1><span id="storeStatus">Carregando cardápio…</span></div>
  <button id="trackBtn" class="ghost">Acompanhar</button>
</header>
<main>
  <section id="banner" class="banner hidden"></section>
  <input id="search" class="search" placeholder="Buscar no cardápio" autocomplete="off">
  <nav id="cats" class="cats"></nav>
  <section id="products" class="products"><div class="loading">Carregando produtos…</div></section>
</main>
<button id="cartBtn" class="cart"><span id="cartLabel">Carrinho • 0 itens</span><b id="cartTotal">R$ 0,00</b></button>
<div id="modal"></div>
</body>
</html>
