<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>O Caseirão Burger</title>
<style>
:root{--bg:#0b0d10;--panel:#12151a;--panel2:#181c22;--line:#2a2f38;--txt:#f7f7f8;--muted:#9da4ae;--brand:#ffb000;--danger:#ff5a5f;--ok:#2ecc71;--blue:#4da3ff;--r:18px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}body{min-height:100vh;padding-bottom:92px}.hide{display:none!important}
.top{position:sticky;top:0;z-index:30;background:rgba(11,13,16,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topin{max-width:980px;margin:auto;padding:16px 18px 14px;display:flex;gap:12px;align-items:center}.brand{min-width:0;flex:1}.brand h1{margin:0;font-size:21px;line-height:1.15}.status{font-size:13px;color:var(--muted);margin-top:4px}.status.open{color:#7ee2a8}.status.closed{color:#ff8b8e}.headbtn{border:1px solid var(--line);background:#20252d;color:#fff;border-radius:13px;padding:11px 13px;font-weight:800}
.wrap{max-width:980px;margin:auto;padding:16px 18px 28px}.banner{background:linear-gradient(135deg,#302208,#18140c);border:1px solid #5b430f;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-weight:800}.search{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:15px;background:#111419;color:#fff;outline:none}.cats{display:flex;gap:8px;overflow:auto;padding:12px 0 4px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#15191f;color:#d8dce2;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800}.chip.on{background:var(--brand);border-color:var(--brand);color:#181000}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.card{border:1px solid var(--line);background:var(--panel);border-radius:17px;overflow:hidden;display:flex;flex-direction:column;min-width:0}.pic{aspect-ratio:4/3;background:#1a1f26;display:grid;place-items:center;color:#6e7681;font-weight:900;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover;display:block}.pc{padding:13px;display:flex;flex-direction:column;gap:8px;flex:1}.name{font-weight:900;font-size:16px}.desc{font-size:12px;color:var(--muted);line-height:1.35;min-height:32px}.price{font-weight:950;font-size:17px}.old{color:#777;text-decoration:line-through;font-size:12px;margin-right:5px}.add{border:0;background:var(--brand);color:#171000;font-weight:950;padding:11px 12px;border-radius:12px;margin-top:auto}.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
.cartbar{position:fixed;z-index:35;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#0b0d10 28%)}.cartbtn{max-width:980px;margin:auto;width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:var(--brand);color:#171000;border-radius:15px;padding:15px 17px;font-weight:950;box-shadow:0 9px 30px rgba(255,176,0,.18)}
.overlay{position:fixed;z-index:80;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:#0f1216;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}.sheet.full{max-width:1040px;height:96vh;max-height:96vh}.sheeth{display:flex;gap:10px;align-items:center;position:sticky;top:-18px;background:#0f1216;padding:16px 0 10px;z-index:3}.sheeth h2{margin:0;flex:1;font-size:21px}.x{border:1px solid var(--line);background:#1a1e25;color:#fff;border-radius:12px;width:42px;height:42px;font-size:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:#b3bac4;font-weight:800}.in,.sel,.ta{width:100%;border:1px solid var(--line);background:#14181e;color:#fff;border-radius:13px;padding:13px 14px;outline:none}.ta{min-height:82px;resize:vertical}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.seg button{border:1px solid var(--line);background:#171b21;color:#dfe3e8;border-radius:12px;padding:11px 8px;font-weight:850}.seg button.on{background:#fff;color:#111;border-color:#fff}.lineitem{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #20252c}.lineitem .grow{flex:1;min-width:0}.qty{display:flex;align-items:center;gap:7px}.qty button{width:33px;height:33px;border:1px solid var(--line);border-radius:10px;background:#1c2128;color:#fff;font-weight:900}.sum{margin-top:12px;padding:13px 0;border-top:1px solid var(--line)}.sumrow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;color:#ccd1d7}.sumrow.total{font-size:19px;font-weight:950;color:#fff}.primary{width:100%;border:0;background:var(--brand);color:#171000;border-radius:13px;padding:14px 15px;font-weight:950}.secondary{width:100%;border:1px solid var(--line);background:#1b2027;color:#fff;border-radius:13px;padding:13px 15px;font-weight:900}.danger{background:#32191b!important;color:#ff8d91!important;border-color:#623035!important}.okbtn{background:#12311f!important;color:#84efae!important;border-color:#235b3a!important}.notice{padding:11px 12px;border:1px solid #314057;background:#151d29;border-radius:12px;color:#bdd5ff;font-size:13px}.err{padding:11px 12px;border:1px solid #603036;background:#2b171a;border-radius:12px;color:#ffacaf;font-size:13px}.success{padding:11px 12px;border:1px solid #245c39;background:#13291c;border-radius:12px;color:#98efb7;font-size:13px}
.addon{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0}.addon input{width:19px;height:19px}.addon .grow{flex:1}.trackbox{border:1px solid var(--line);border-radius:14px;padding:14px;background:#15191f}.timeline{margin-top:12px}.step{display:flex;gap:10px;padding:8px 0}.dot{width:12px;height:12px;border-radius:50%;margin-top:4px;background:#3a414b}.dot.done{background:var(--brand)}
.loginbox{max-width:430px;margin:48px auto}.admbar{display:flex;gap:8px;overflow:auto;padding-bottom:10px;scrollbar-width:none}.admbar button{white-space:nowrap;border:1px solid var(--line);background:#171b21;color:#d8dce2;border-radius:11px;padding:10px 12px;font-weight:850}.admbar button.on{background:var(--brand);color:#171000;border-color:var(--brand)}.admgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{border:1px solid var(--line);background:#15191f;border-radius:14px;padding:13px}.metric b{font-size:22px}.metric span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.order{border:1px solid var(--line);background:#14181e;border-radius:15px;padding:14px;margin:10px 0}.ordertop{display:flex;gap:8px;align-items:center}.badge{border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:11px;font-weight:900;text-transform:uppercase}.orderactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.orderactions button{border:1px solid var(--line);background:#20252d;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:850}.tableitem{border:1px solid var(--line);background:#14181e;border-radius:14px;padding:12px;margin:9px 0;display:flex;gap:10px;align-items:center}.tableitem .grow{flex:1;min-width:0}.mini{font-size:12px;color:var(--muted)}.twoBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px}.editbtn{border:1px solid var(--line);background:#20252d;color:#fff;border-radius:10px;padding:9px 10px;font-weight:850}.statuspill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;background:#20252d;color:#d9dee5}.green{color:#75e7a1}.red{color:#ff8b90}
@media(max-width:640px){.grid{grid-template-columns:1fr 1fr}.pc{padding:11px}.name{font-size:14px}.price{font-size:15px}.desc{min-height:0}.row{grid-template-columns:1fr}.admgrid{grid-template-columns:1fr 1fr}.topin{padding-left:14px;padding-right:14px}.wrap{padding-left:14px;padding-right:14px}.headbtn{padding:10px 11px;font-size:13px}}
@media(max-width:370px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><h1 id="storeName">O Caseirão Burger</h1><div id="storeStatus" class="status">Carregando cardápio...</div></div><button class="headbtn" id="trackBtn">Acompanhar</button><button class="headbtn" id="adminBtn">ADM</button></div></header>
<main class="wrap">
<div id="banner" class="banner hide"></div>
<input id="search" class="search" placeholder="Buscar no cardápio" autocomplete="off">
<div id="cats" class="cats"></div>
<div id="products" class="grid"><div class="empty">Carregando produtos...</div></div>
</main>
<div class="cartbar"><button id="cartBtn" class="cartbtn"><span id="cartLabel">Carrinho • 0 itens</span><span id="cartTotal">R$ 0,00</span></button></div>
<div id="modalRoot"></div>
<script>
(()=>{
'use strict';
const FN='https://jhvtjhjzlljqfzdccrxc.supabase.co/functions/v1/';
const $=s=>document.querySelector(s), fmt=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
let data={settings:{},products:[],neighborhoods:[],addons:[],product_addons:[],coupons:[]},cart=[],cat='Todos',search='',orderType='delivery',admin=null,adminTab='pedidos';
const modalRoot=$('#modalRoot');
async function api(slug,opts={}){const r=await fetch(FN+slug,{cache:'no-store',...opts});let j={};try{j=await r.json()}catch{}if(!r.ok||j.error)throw new Error(j.error||j.detail||('Erro '+r.status));return j}
async function catalog(){try{data=await api('catalog');renderCatalog()}catch(e){$('#storeStatus').textContent='Erro ao carregar';$('#storeStatus').className='status closed';$('#products').innerHTML=`<div class="empty"><b>Não foi possível carregar.</b><br>${esc(e.message)}<br><br><button class="secondary" onclick="location.reload()">Tentar novamente</button></div>`}}
function priceOf(p){return Number(p.promo_price)>0?Number(p.promo_price):Number(p.price||0)}
function allowedAddons(p){const ids=new Set(data.product_addons.filter(x=>x.product_id===p.id).map(x=>x.addon_id));return data.addons.filter(a=>a.active!==false&&ids.has(a.id))}
function cartCount(){return cart.reduce((s,x)=>s+x.qty,0)}function cartSubtotal(){return cart.reduce((s,x)=>s+(priceOf(x.product)+x.addons.reduce((a,b)=>a+Number(b.price||0),0))*x.qty,0)}
function renderCatalog(){const st=data.settings||{};$('#storeName').textContent=st.store_name||'O Caseirão Burger';const open=!!st.store_open;$('#storeStatus').textContent=st.status_text||(open?'Aberto':'Fechado');$('#storeStatus').className='status '+(open?'open':'closed');if(st.banner_active&&st.banner_text){$('#banner').textContent=st.banner_text;$('#banner').classList.remove('hide')}else $('#banner').classList.add('hide');const cats=['Todos',...new Set(data.products.filter(p=>p.active!==false).map(p=>p.category||'Outros'))];$('#cats').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;renderCatalog()});const q=search.trim().toLowerCase();const arr=data.products.filter(p=>p.active!==false&&(cat==='Todos'||(p.category||'Outros')===cat)&&(!q||(p.name+' '+(p.description||'')).toLowerCase().includes(q)));$('#products').innerHTML=arr.length?arr.map(p=>{const promo=Number(p.promo_price)>0;return `<article class="card"><div class="pic">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy" onerror="this.parentNode.innerHTML='SEM FOTO'">`:'SEM FOTO'}</div><div class="pc"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||p.category||'')}</div><div class="price">${promo?`<span class="old">${fmt(p.price)}</span>`:''}${fmt(priceOf(p))}</div><button class="add" data-add="${p.id}">Adicionar</button></div></article>`}).join(''):'<div class="empty">Nenhum item encontrado.</div>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openProduct(b.dataset.add));updateCartBar()}
function openProduct(id){const p=data.products.find(x=>x.id===id);if(!p)return;const adds=allowedAddons(p);modal(`<div class="sheeth"><h2>${esc(p.name)}</h2><button class="x" data-close>×</button></div><div class="notice">${esc(p.description||'Escolha os adicionais e observações.')}</div><div class="field"><label>Adicionais</label>${adds.length?adds.map(a=>`<label class="addon"><input type="checkbox" data-addon="${a.id}"><span class="grow">${esc(a.name)}</span><b>+ ${fmt(a.price)}</b></label>`).join(''):'<div class="mini">Este produto não possui adicionais cadastrados.</div>'}</div><div class="field"><label>Observação do item</label><textarea id="itemNote" class="ta" placeholder="Ex.: sem cebola, caprichar no molho..."></textarea></div><button id="confirmAdd" class="primary">Adicionar ao carrinho • ${fmt(priceOf(p))}</button>`);bindClose();$('#confirmAdd').onclick=()=>{const selected=[...document.querySelectorAll('[data-addon]:checked')].map(i=>data.addons.find(a=>a.id===i.dataset.addon)).filter(Boolean);cart.push({key:crypto.randomUUID(),product:p,addons:selected,note:$('#itemNote').value.trim(),qty:1});closeModal();updateCartBar()}}
function updateCartBar(){const n=cartCount();$('#cartLabel').textContent=`Carrinho • ${n} ${n===1?'item':'itens'}`;$('#cartTotal').textContent=fmt(cartSubtotal())}
function modal(html,full=false){modalRoot.innerHTML=`<div class="overlay"><section class="sheet ${full?'full':''}">${html}</section></div>`;modalRoot.querySelector('.overlay').addEventListener('click',e=>{if(e.target.classList.contains('overlay'))closeModal()})}function closeModal(){modalRoot.innerHTML=''}function bindClose(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
function renderCart(){modal(`<div class="sheeth"><h2>Seu pedido</h2><button class="x" data-close>×</button></div><div id="cartLines"></div><div class="sum"><div class="sumrow"><span>Subtotal</span><b>${fmt(cartSubtotal())}</b></div></div><div class="twoBtns"><button class="secondary" data-close>Continuar comprando</button><button id="goCheckout" class="primary" ${cart.length?'':'disabled'}>Continuar</button></div>`);bindClose();const box=$('#cartLines');box.innerHTML=cart.length?cart.map(x=>`<div class="lineitem"><div class="grow"><b>${esc(x.product.name)}</b><div class="mini">${x.addons.map(a=>esc(a.name)).join(', ')||'Sem adicionais'}${x.note?'<br>'+esc(x.note):''}</div><div class="mini">${fmt((priceOf(x.product)+x.addons.reduce((s,a)=>s+Number(a.price||0),0))*x.qty)}</div></div><div class="qty"><button data-q="${x.key}" data-d="-1">−</button><b>${x.qty}</b><button data-q="${x.key}" data-d="1">+</button></div></div>`).join(''):'<div class="empty">Seu carrinho está vazio.</div>';document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const x=cart.find(i=>i.key===b.dataset.q);if(!x)return;x.qty+=Number(b.dataset.d);if(x.qty<=0)cart=cart.filter(i=>i.key!==x.key);updateCartBar();renderCart()});if($('#goCheckout'))$('#goCheckout').onclick=openCheckout}
function checkoutFee(){if(orderType!=='delivery')return 0;const id=$('#neighborhood')?.value;return Number(data.neighborhoods.find(n=>n.id===id)?.fee||0)}
function openCheckout(){const ns=data.neighborhoods.filter(n=>n.active!==false);const st=data.settings||{};modal(`<div class="sheeth"><h2>Finalizar pedido</h2><button class="x" data-close>×</button></div><div class="seg"><button data-type="delivery" class="${orderType==='delivery'?'on':''}">Entrega</button><button data-type="pickup" class="${orderType==='pickup'?'on':''}">Retirada</button><button data-type="local" class="${orderType==='local'?'on':''}">No local</button></div><div class="row"><div class="field"><label>Seu nome</label><input id="custName" class="in" autocomplete="name"></div><div class="field"><label>WhatsApp</label><input id="custPhone" class="in" inputmode="tel" placeholder="(86) 99999-9999"></div></div><div id="addressBox"></div><div class="row"><div class="field"><label>Pagamento</label><select id="payment" class="sel"><option value="Pix">Pix</option><option value="Dinheiro">Dinheiro</option><option value="Cartão">Cartão</option></select></div><div class="field"><label>Troco para</label><input id="changeFor" class="in" placeholder="Ex.: 50,00"></div></div><div class="field"><label>Cupom</label><input id="coupon" class="in" placeholder="Opcional"></div><div class="field"><label>Observações gerais</label><textarea id="orderNotes" class="ta" placeholder="Alguma observação sobre o pedido?"></textarea></div>${st.pix_text?`<div class="notice">${esc(st.pix_text)}</div>`:''}<div id="checkoutSum" class="sum"></div><button id="sendOrder" class="primary">Enviar pedido</button>`);bindClose();document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{orderType=b.dataset.type;openCheckout()});renderAddress();renderCheckoutSum();$('#neighborhood')?.addEventListener('change',renderCheckoutSum);$('#sendOrder').onclick=sendOrder}
function renderAddress(){const box=$('#addressBox');if(!box)return;if(orderType!=='delivery'){box.innerHTML=`<div class="notice">${orderType==='pickup'?'Você retira no Caseirão.':'Pedido para consumo no local.'}</div>`;return}box.innerHTML=`<div class="row"><div class="field"><label>Rua / Avenida</label><input id="street" class="in"></div><div class="field"><label>Número</label><input id="number" class="in"></div></div><div class="row"><div class="field"><label>Bairro</label><select id="neighborhood" class="sel"><option value="">Selecione</option>${data.neighborhoods.filter(n=>n.active!==false).map(n=>`<option value="${n.id}">${esc(n.name)} • ${fmt(n.fee)}</option>`).join('')}</select></div><div class="field"><label>Complemento</label><input id="complement" class="in" placeholder="Casa, apto..."></div></div><div class="field"><label>Referência</label><input id="reference" class="in"></div>`}
function renderCheckoutSum(){const subtotal=cartSubtotal(),fee=checkoutFee();$('#checkoutSum').innerHTML=`<div class="sumrow"><span>Subtotal</span><b>${fmt(subtotal)}</b></div><div class="sumrow"><span>Entrega</span><b>${fmt(fee)}</b></div><div class="sumrow total"><span>Total estimado</span><b>${fmt(subtotal+fee)}</b></div>`}
async function sendOrder(){try{const btn=$('#sendOrder');btn.disabled=true;btn.textContent='Enviando...';const customer={name:$('#custName').value.trim(),phone:$('#custPhone').value.trim()};const payload={customer,type:orderType,payment:$('#payment').value,change_for:$('#changeFor').value.trim(),coupon_code:$('#coupon').value.trim(),notes:$('#orderNotes').value.trim(),items:cart.map(x=>({product_id:x.product.id,qty:x.qty,addon_ids:x.addons.map(a=>a.id),note:x.note}))};if(orderType==='delivery')payload.address={street:$('#street').value.trim(),number:$('#number').value.trim(),neighborhood_id:$('#neighborhood').value,complement:$('#complement').value.trim(),reference:$('#reference').value.trim()};const j=await api('create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});localStorage.setItem('caseirao_last_tracking',JSON.stringify({tracking_code:j.tracking_code,phone:customer.phone}));cart=[];updateCartBar();modal(`<div class="sheeth"><h2>Pedido recebido ✅</h2><button class="x" data-close>×</button></div><div class="success"><b>Pedido #${j.order_number}</b><br>Código: <b>${esc(j.tracking_code)}</b><br>Total: <b>${fmt(j.total)}</b></div><br><button id="trackNow" class="primary">Acompanhar pedido</button>`);bindClose();$('#trackNow').onclick=()=>openTracking(j.tracking_code,customer.phone)}catch(e){alert(e.message);if($('#sendOrder')){$('#sendOrder').disabled=false;$('#sendOrder').textContent='Enviar pedido'}}}
function openTracking(code='',phone=''){const saved=(()=>{try{return JSON.parse(localStorage.getItem('caseirao_last_tracking')||'{}')}catch{return{}}})();modal(`<div class="sheeth"><h2>Acompanhar pedido</h2><button class="x" data-close>×</button></div><div class="field"><label>Código do pedido</label><input id="trackCode" class="in" value="${esc(code||saved.tracking_code||'')}"></div><div class="field"><label>Seu telefone</label><input id="trackPhone" class="in" inputmode="tel" value="${esc(phone||saved.phone||'')}"></div><button id="doTrack" class="primary">Consultar</button><div id="trackResult" style="margin-top:12px"></div>`);bindClose();$('#doTrack').onclick=trackOrder;if(code||saved.tracking_code)trackOrder()}
const statusLabel={novo:'Pedido recebido',confirmado:'Confirmado',preparando:'Em preparo',pronto:'Pronto',em_rota:'Em rota',entregue:'Entregue',cancelado:'Cancelado'};
async function trackOrder(){try{const code=$('#trackCode').value.trim(),phone=$('#trackPhone').value.trim();const j=await api('track-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tracking_code:code,phone})});localStorage.setItem('caseirao_last_tracking',JSON.stringify({tracking_code:code,phone}));$('#trackResult').innerHTML=`<div class="trackbox"><b>Pedido #${j.order.order_number}</b><div style="font-size:21px;font-weight:950;margin:7px 0">${esc(statusLabel[j.order.status]||j.order.status)}</div><div class="mini">Total ${fmt(j.order.total)}</div></div><div class="timeline">${(j.history||[]).map(h=>`<div class="step"><span class="dot done"></span><div><b>${esc(statusLabel[h.status]||h.status)}</b><div class="mini">${new Date(h.changed_at).toLocaleString('pt-BR')}</div></div></div>`).join('')}</div>`}catch(e){$('#trackResult').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
function openAdmin(){modal(`<div class="sheeth"><h2>Área administrativa</h2><button class="x" data-close>×</button></div><div class="loginbox"><div class="field"><label>PIN do ADM</label><input id="adminPin" class="in" type="password" inputmode="numeric" autocomplete="off"></div><button id="adminLogin" class="primary">Entrar</button><div id="adminErr" style="margin-top:10px"></div></div>`,true);bindClose();$('#adminLogin').onclick=adminLogin}
async function adminCall(action='snapshot',payload={}){const pin=sessionStorage.getItem('caseirao_admin_pin')||'';return api('admin-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,action,payload})})}
async function adminLogin(){try{const pin=$('#adminPin').value.trim();sessionStorage.setItem('caseirao_admin_pin',pin);admin=await adminCall('snapshot');renderAdmin()}catch(e){sessionStorage.removeItem('caseirao_admin_pin');$('#adminErr').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function refreshAdmin(){admin=await adminCall('snapshot');renderAdmin()}
function renderAdmin(){if(!admin)return;const today=admin.orders.filter(o=>new Date(o.created_at).toDateString()===new Date().toDateString()&&o.status!=='cancelado');const sales=today.reduce((s,o)=>s+Number(o.total||0),0);modal(`<div class="sheeth"><h2>ADM • O Caseirão</h2><button class="x" data-close>×</button></div><div class="admgrid"><div class="metric"><b>${today.length}</b><span>Pedidos hoje</span></div><div class="metric"><b>${fmt(sales)}</b><span>Vendas hoje</span></div><div class="metric"><b>${admin.products.filter(p=>p.active).length}</b><span>Produtos ativos</span></div><div class="metric"><b class="${admin.settings.store_open?'green':'red'}">${admin.settings.store_open?'ABERTO':'FECHADO'}</b><span>Loja agora</span></div></div><div class="admbar" style="margin-top:14px">${[['pedidos','Pedidos'],['produtos','Produtos'],['bairros','Bairros'],['adicionais','Adicionais'],['cupons','Cupons'],['loja','Loja']].map(([k,n])=>`<button data-tab="${k}" class="${adminTab===k?'on':''}">${n}</button>`).join('')}</div><div id="admContent"></div>`,true);bindClose();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.tab;renderAdmin()});renderAdminTab()}
function renderAdminTab(){const box=$('#admContent');if(!box)return;if(adminTab==='pedidos')renderOrders(box);if(adminTab==='produtos')renderProductsAdmin(box);if(adminTab==='bairros')renderNeighborhoodsAdmin(box);if(adminTab==='adicionais')renderAddonsAdmin(box);if(adminTab==='cupons')renderCouponsAdmin(box);if(adminTab==='loja')renderStoreAdmin(box)}
function orderText(o){return `${o.type==='delivery'?'Entrega':o.type==='pickup'?'Retirada':'Local'} • ${o.customer_name} • ${fmt(o.total)}`}
function renderOrders(box){const active=admin.orders.filter(o=>!['entregue','cancelado'].includes(o.status));box.innerHTML=`<div class="twoBtns" style="margin:10px 0"><button id="refreshOrders" class="secondary">Atualizar</button><button id="manualOrder" class="secondary">Pedido manual</button></div>${active.length?active.map(o=>`<div class="order"><div class="ordertop"><b>#${o.order_number}</b><span class="badge">${esc(statusLabel[o.status]||o.status)}</span><span class="grow"></span><b>${fmt(o.total)}</b></div><div class="mini" style="margin-top:6px">${esc(orderText(o))}<br>${o.customer_phone?esc(o.customer_phone):''}${o.neighborhood_name?' • '+esc(o.neighborhood_name):''}</div><div class="orderactions">${[['confirmado','Confirmar'],['preparando','Preparando'],['pronto','Pronto'],['em_rota','Em rota'],['entregue','Entregue'],['cancelado','Cancelar']].map(([s,l])=>`<button data-st="${s}" data-oid="${o.id}" class="${s==='cancelado'?'danger':''}">${l}</button>`).join('')}</div></div>`).join(''):'<div class="empty">Nenhum pedido em andamento.</div>'}`;$('#refreshOrders').onclick=refreshAdmin;$('#manualOrder').onclick=openManualOrder;document.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{if(b.dataset.st==='cancelado'&&!confirm('Cancelar este pedido?'))return;try{await adminCall('update_status',{order_id:b.dataset.oid,status:b.dataset.st});await refreshAdmin()}catch(e){alert(e.message)}})}
function openManualOrder(){const opts=admin.products.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)} • ${fmt(priceOf(p))}</option>`).join('');modal(`<div class="sheeth"><h2>Pedido manual</h2><button class="x" data-close>×</button></div><div class="row"><div class="field"><label>Nome</label><input id="mName" class="in"></div><div class="field"><label>Telefone</label><input id="mPhone" class="in" inputmode="tel"></div></div><div class="field"><label>Produto</label><select id="mProduct" class="sel">${opts}</select></div><div class="field"><label>Quantidade</label><input id="mQty" class="in" type="number" value="1" min="1"></div><div class="field"><label>Tipo</label><select id="mType" class="sel"><option value="pickup">Retirada</option><option value="local">No local</option></select></div><div class="field"><label>Pagamento</label><select id="mPay" class="sel"><option>Dinheiro</option><option>Pix</option><option>Cartão</option></select></div><button id="mSend" class="primary">Criar pedido</button>`);bindClose();$('#mSend').onclick=async()=>{try{await adminCall('create_manual_order',{customer:{name:$('#mName').value.trim()||'Pedido manual',phone:$('#mPhone').value.trim()},type:$('#mType').value,payment:$('#mPay').value,items:[{product_id:$('#mProduct').value,qty:Number($('#mQty').value)||1,addon_ids:[]} ]});admin=await adminCall('snapshot');adminTab='pedidos';renderAdmin()}catch(e){alert(e.message)}}}
function renderProductsAdmin(box){box.innerHTML=`<button id="newProduct" class="primary" style="margin:10px 0">+ Novo produto</button>${admin.products.map(p=>`<div class="tableitem"><div class="grow"><b>${esc(p.name)}</b><div class="mini">${esc(p.category)} • ${fmt(p.price)} ${p.promo_price?`• Promo ${fmt(p.promo_price)}`:''} • ${p.active?'Ativo':'Inativo'}</div></div><button class="editbtn" data-editp="${p.id}">Editar</button></div>`).join('')}`;$('#newProduct').onclick=()=>editProduct(null);document.querySelectorAll('[data-editp]').forEach(b=>b.onclick=()=>editProduct(admin.products.find(p=>p.id===b.dataset.editp)))}
function editProduct(p){p=p||{name:'',category:'Lanches',description:'',price:'',promo_price:'',image_url:'',active:true,featured:false};const selected=new Set(admin.product_addons.filter(x=>x.product_id===p.id).map(x=>x.addon_id));modal(`<div class="sheeth"><h2>${p.id?'Editar produto':'Novo produto'}</h2><button class="x" data-close>×</button></div><div class="row"><div class="field"><label>Nome</label><input id="pName" class="in" value="${esc(p.name)}"></div><div class="field"><label>Categoria</label><input id="pCat" class="in" value="${esc(p.category||'Lanches')}"></div></div><div class="field"><label>Descrição</label><textarea id="pDesc" class="ta">${esc(p.description||'')}</textarea></div><div class="row"><div class="field"><label>Preço</label><input id="pPrice" class="in" inputmode="decimal" value="${esc(p.price)}"></div><div class="field"><label>Preço promocional</label><input id="pPromo" class="in" inputmode="decimal" value="${esc(p.promo_price||'')}"></div></div><div class="field"><label>Foto</label><input id="pFile" class="in" type="file" accept="image/jpeg,image/png,image/webp"><input id="pImg" class="in" style="margin-top:8px" placeholder="URL da foto" value="${esc(p.image_url||'')}"></div><div class="field"><label>Adicionais permitidos</label>${admin.addons.map(a=>`<label class="addon"><input type="checkbox" data-pa="${a.id}" ${selected.has(a.id)?'checked':''}><span class="grow">${esc(a.name)}</span><span>${fmt(a.price)}</span></label>`).join('')}</div><label class="addon"><input id="pActive" type="checkbox" ${p.active?'checked':''}><span>Produto ativo</span></label><label class="addon"><input id="pFeatured" type="checkbox" ${p.featured?'checked':''}><span>Destacar produto</span></label><div class="twoBtns"><button id="saveP" class="primary">Salvar</button>${p.id?'<button id="delP" class="secondary danger">Excluir</button>':'<button class="secondary" data-close>Cancelar</button>'}</div>`);bindClose();$('#pFile').onchange=async()=>{const f=$('#pFile').files[0];if(!f)return;try{$('#pImg').value='Enviando...';const base64=await fileToBase64(f);const pin=sessionStorage.getItem('caseirao_admin_pin')||'';const j=await api('admin-upload-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,content_type:f.type,base64})});$('#pImg').value=j.public_url}catch(e){alert(e.message);$('#pImg').value=p.image_url||''}};$('#saveP').onclick=async()=>{try{await adminCall('upsert_product',{id:p.id,name:$('#pName').value.trim(),category:$('#pCat').value.trim(),description:$('#pDesc').value.trim(),price:num($('#pPrice').value),promo_price:$('#pPromo').value.trim()===''?null:num($('#pPromo').value),image_url:$('#pImg').value.trim(),active:$('#pActive').checked,featured:$('#pFeatured').checked,addon_ids:[...document.querySelectorAll('[data-pa]:checked')].map(i=>i.dataset.pa)});admin=await adminCall('snapshot');adminTab='produtos';renderAdmin()}catch(e){alert(e.message)}};if($('#delP'))$('#delP').onclick=async()=>{if(confirm('Excluir este produto?')){try{await adminCall('delete_product',{id:p.id});admin=await adminCall('snapshot');adminTab='produtos';renderAdmin()}catch(e){alert(e.message)}}}}
const num=v=>Number(String(v).replace(',','.'))||0;function fileToBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function renderNeighborhoodsAdmin(box){box.innerHTML=`<button id="newN" class="primary" style="margin:10px 0">+ Novo bairro</button>${admin.neighborhoods.map(n=>`<div class="tableitem"><div class="grow"><b>${esc(n.name)}</b><div class="mini">Taxa ${fmt(n.fee)} • ${n.active?'Ativo':'Inativo'}</div></div><button class="editbtn" data-n="${n.id}">Editar</button></div>`).join('')}`;$('#newN').onclick=()=>editNeighborhood(null);document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>editNeighborhood(admin.neighborhoods.find(n=>n.id===b.dataset.n)))}
function editNeighborhood(n){n=n||{name:'',fee:'',active:true};modal(`<div class="sheeth"><h2>${n.id?'Editar bairro':'Novo bairro'}</h2><button class="x" data-close>×</button></div><div class="field"><label>Nome</label><input id="nName" class="in" value="${esc(n.name)}"></div><div class="field"><label>Taxa de entrega</label><input id="nFee" class="in" inputmode="decimal" value="${esc(n.fee)}"></div><label class="addon"><input id="nActive" type="checkbox" ${n.active?'checked':''}><span>Ativo</span></label><div class="twoBtns"><button id="saveN" class="primary">Salvar</button>${n.id?'<button id="delN" class="secondary danger">Excluir</button>':'<button class="secondary" data-close>Cancelar</button>'}</div>`);bindClose();$('#saveN').onclick=async()=>{try{await adminCall('upsert_neighborhood',{id:n.id,name:$('#nName').value.trim(),fee:num($('#nFee').value),active:$('#nActive').checked});admin=await adminCall('snapshot');adminTab='bairros';renderAdmin()}catch(e){alert(e.message)}};if($('#delN'))$('#delN').onclick=async()=>{if(confirm('Excluir bairro?')){await adminCall('delete_neighborhood',{id:n.id});admin=await adminCall('snapshot');adminTab='bairros';renderAdmin()}}}
function renderAddonsAdmin(box){box.innerHTML=`<button id="newA" class="primary" style="margin:10px 0">+ Novo adicional</button>${admin.addons.map(a=>`<div class="tableitem"><div class="grow"><b>${esc(a.name)}</b><div class="mini">${fmt(a.price)} • ${a.active?'Ativo':'Inativo'}</div></div><button class="editbtn" data-a="${a.id}">Editar</button></div>`).join('')}`;$('#newA').onclick=()=>editAddon(null);document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>editAddon(admin.addons.find(a=>a.id===b.dataset.a)))}
function editAddon(a){a=a||{name:'',price:'',active:true};modal(`<div class="sheeth"><h2>${a.id?'Editar adicional':'Novo adicional'}</h2><button class="x" data-close>×</button></div><div class="field"><label>Nome</label><input id="aName" class="in" value="${esc(a.name)}"></div><div class="field"><label>Preço</label><input id="aPrice" class="in" inputmode="decimal" value="${esc(a.price)}"></div><label class="addon"><input id="aActive" type="checkbox" ${a.active?'checked':''}><span>Ativo</span></label><div class="twoBtns"><button id="saveA" class="primary">Salvar</button>${a.id?'<button id="delA" class="secondary danger">Excluir</button>':'<button class="secondary" data-close>Cancelar</button>'}</div>`);bindClose();$('#saveA').onclick=async()=>{await adminCall('upsert_addon',{id:a.id,name:$('#aName').value.trim(),price:num($('#aPrice').value),active:$('#aActive').checked});admin=await adminCall('snapshot');adminTab='adicionais';renderAdmin()};if($('#delA'))$('#delA').onclick=async()=>{if(confirm('Excluir adicional?')){await adminCall('delete_addon',{id:a.id});admin=await adminCall('snapshot');adminTab='adicionais';renderAdmin()}}}
function renderCouponsAdmin(box){box.innerHTML=`<button id="newC" class="primary" style="margin:10px 0">+ Novo cupom</button>${admin.coupons.length?admin.coupons.map(c=>`<div class="tableitem"><div class="grow"><b>${esc(c.code)}</b><div class="mini">${esc(c.type)} • ${c.value} • mínimo ${fmt(c.min_subtotal)} • ${c.active?'Ativo':'Inativo'}</div></div><button class="editbtn" data-c="${c.id}">Editar</button></div>`).join(''):'<div class="empty">Nenhum cupom cadastrado.</div>'}`;$('#newC').onclick=()=>editCoupon(null);document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>editCoupon(admin.coupons.find(c=>c.id===b.dataset.c)))}
function editCoupon(c){c=c||{code:'',type:'fixed',value:'',min_subtotal:0,active:true};modal(`<div class="sheeth"><h2>${c.id?'Editar cupom':'Novo cupom'}</h2><button class="x" data-close>×</button></div><div class="field"><label>Código</label><input id="cCode" class="in" value="${esc(c.code)}"></div><div class="row"><div class="field"><label>Tipo</label><select id="cType" class="sel"><option value="fixed" ${c.type==='fixed'?'selected':''}>Valor fixo</option><option value="percent" ${c.type==='percent'?'selected':''}>Percentual</option><option value="free_delivery" ${c.type==='free_delivery'?'selected':''}>Entrega grátis</option></select></div><div class="field"><label>Valor</label><input id="cValue" class="in" inputmode="decimal" value="${esc(c.value)}"></div></div><div class="field"><label>Pedido mínimo</label><input id="cMin" class="in" inputmode="decimal" value="${esc(c.min_subtotal)}"></div><label class="addon"><input id="cActive" type="checkbox" ${c.active?'checked':''}><span>Ativo</span></label><div class="twoBtns"><button id="saveC" class="primary">Salvar</button>${c.id?'<button id="delC" class="secondary danger">Excluir</button>':'<button class="secondary" data-close>Cancelar</button>'}</div>`);bindClose();$('#saveC').onclick=async()=>{await adminCall('upsert_coupon',{id:c.id,code:$('#cCode').value.trim(),type:$('#cType').value,value:num($('#cValue').value),min_subtotal:num($('#cMin').value),active:$('#cActive').checked});admin=await adminCall('snapshot');adminTab='cupons';renderAdmin()};if($('#delC'))$('#delC').onclick=async()=>{if(confirm('Excluir cupom?')){await adminCall('delete_coupon',{id:c.id});admin=await adminCall('snapshot');adminTab='cupons';renderAdmin()}}}
function renderStoreAdmin(box){const s=admin.settings;box.innerHTML=`<div class="field"><label>Nome da loja</label><input id="sName" class="in" value="${esc(s.store_name)}"></div><div class="row"><div class="field"><label>WhatsApp</label><input id="sWhats" class="in" value="${esc(s.whatsapp)}"></div><div class="field"><label>Pedido mínimo</label><input id="sMin" class="in" value="${esc(s.min_order)}"></div></div><div class="field"><label>Endereço</label><input id="sAddr" class="in" value="${esc(s.address)}"></div><div class="field"><label>Texto do status</label><input id="sStatus" class="in" value="${esc(s.status_text)}"></div><div class="field"><label>Aviso do Pix</label><textarea id="sPix" class="ta">${esc(s.pix_text)}</textarea></div><div class="row"><div class="field"><label>Abre</label><input id="sOpen" class="in" type="time" value="${esc(String(s.open_time||'18:00').slice(0,5))}"></div><div class="field"><label>Fecha</label><input id="sClose" class="in" type="time" value="${esc(String(s.close_time||'23:20').slice(0,5))}"></div></div><label class="addon"><input id="sBannerA" type="checkbox" ${s.banner_active?'checked':''}><span>Banner ativo</span></label><div class="field"><label>Texto do banner</label><input id="sBanner" class="in" value="${esc(s.banner_text||'')}"></div><button id="saveStore" class="primary">Salvar configurações</button><div class="twoBtns" style="margin-top:10px"><button id="openShift" class="secondary okbtn">Abrir expediente</button><button id="closeShift" class="secondary danger">Fechar expediente</button></div>${admin.open_shift?`<div class="notice" style="margin-top:10px">Expediente aberto desde ${new Date(admin.open_shift.opened_at).toLocaleString('pt-BR')}</div>`:''}`;$('#saveStore').onclick=async()=>{try{await adminCall('save_settings',{store_name:$('#sName').value.trim(),whatsapp:$('#sWhats').value.trim(),address:$('#sAddr').value.trim(),store_open:s.store_open,status_text:$('#sStatus').value.trim(),pix_text:$('#sPix').value.trim(),schedule_enabled:s.schedule_enabled,open_time:$('#sOpen').value,close_time:$('#sClose').value,delivery_eta:s.delivery_eta,pickup_eta:s.pickup_eta,min_order:num($('#sMin').value),banner_active:$('#sBannerA').checked,banner_text:$('#sBanner').value.trim()});admin=await adminCall('snapshot');renderAdmin();await catalog()}catch(e){alert(e.message)}};$('#openShift').onclick=async()=>{await adminCall('open_shift',{});admin=await adminCall('snapshot');renderAdmin();await catalog()};$('#closeShift').onclick=async()=>{if(!confirm('Fechar expediente agora?'))return;const j=await adminCall('close_shift',{});alert(`Expediente fechado. ${j.orders_count} pedidos • ${fmt(j.sales_total)}`);admin=await adminCall('snapshot');renderAdmin();await catalog()}}
$('#search').addEventListener('input',e=>{search=e.target.value;renderCatalog()});$('#cartBtn').onclick=renderCart;$('#trackBtn').onclick=()=>openTracking();$('#adminBtn').onclick=openAdmin;catalog();
})();
</script>
</body>
</html>
